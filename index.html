<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F28C28" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Nunito is self-hosted (src/fonts, see styles.css); start fetching it with the page. -->
    <link rel="preload" href="/src/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Crunchd</title>
    <!-- The card chats show for a Crunchd link. Squad invites swap in their own (worker/lib/linkPreview.ts). -->
    <meta name="description" content="Rate crisps, pub snacks and sweets with your mates. Check in what you're eating and see who tops the table." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crunchd" />
    <meta property="og:title" content="Crunchd: rate your snacks with your mates" />
    <meta property="og:description" content="Rate crisps, pub snacks and sweets with your mates. Check in what you're eating and see who tops the table." />
    <meta property="og:url" content="https://getcrunchd.com/" />
    <meta property="og:image" content="https://getcrunchd.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crunchd: rate your snacks with your mates" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
